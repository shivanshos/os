[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "os-mcp-registry"
version = "0.1.0"
description = "Local, read-only MCP discovery adapter with versioned SQLite integration registry"
requires-python = ">=3.11"
dependencies = ["mcp>=2.3,<3"]

[project.scripts]
os-mcp-registry = "os_mcp_registry.cli:main"
os-mcp-server = "os_mcp_registry.server:main"
os-mcp-http = "os_mcp_registry.http_api:main"

[tool.setuptools.packages.find]
where = ["src"]
