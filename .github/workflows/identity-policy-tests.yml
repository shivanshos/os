name: Identity policy tests

on:
  pull_request:
    paths:
      - 'identity/**'
      - '.github/workflows/identity-policy-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run standard-library authorization tests
        run: python3 -m unittest discover -s identity/tests -v
