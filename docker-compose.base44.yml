# Base44 sandbox/dev environment for the `os` Cloudflare Worker.
#
# Runs the worker straight from the cloned source with Wrangler's local
# (workerd/Miniflare) dev server on host port 3000, so edits are picked up
# live. This file is only used in the Base44 sandbox; the repo's own
# `wrangler.os.toml` remains the source of truth for deploys.

services:
  web:
    image: node:22
    working_dir: /app
    restart: on-failure
    command:
      - sh
      - -ec
      - |
        npm install --no-audit --no-fund
        exec npx wrangler dev -c wrangler.os.toml --ip 0.0.0.0 --port 3000 --live-reload
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - CI=1
      - WRANGLER_SEND_METRICS=false
      - BASE44_PREVIEW_MODE
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

volumes:
  node_modules:
